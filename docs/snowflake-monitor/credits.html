<title>料金表の改定 — Snowflake Doc Monitor</title>
<style>:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #16181d; --muted: #666e7a;
  --line: #e3e6ea; --accent: #29b5e8; --accent-dark: #11567f; --code-bg: #f2f4f7;
  --s: #d92d20; --a: #e07800; --n: #2563eb; --b: #b0a000; --c: #8a929e;
  --feat: #7b61ff; --url: #12a150; --credit: #d9822b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --card: #1c1f25; --fg: #e9ecf1; --muted: #9aa3b0;
    --line: #2b2f37; --accent: #4fc9f4; --accent-dark: #9fe2fb; --code-bg: #24282f;
    --s: #ff6b5e; --a: #ffb04d; --n: #7aa7ff; --b: #e2d24a; --c: #9aa3b0;
    --feat: #a78bfa; --url: #4ade80; --credit: #fbbf24;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 2.5rem 1.25rem 5rem; background: var(--bg); color: var(--fg);
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  font-weight: 400; line-height: 1.9; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1040px; margin: 0 auto; }
.eyebrow { font-weight: 900; font-size: .8rem; letter-spacing: .18em; color: var(--accent-dark); margin: 0 0 .75rem; }
h1 { font-weight: 900; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.35; margin: 0 0 .6rem; }
h2 { font-weight: 900; font-size: 1.4rem; letter-spacing: .03em; margin: 2.6rem 0 1.1rem;
     padding-left: .75rem; border-left: .4rem solid var(--accent); }
h3 { font-weight: 700; font-size: 1.05rem; margin: 0 0 .5rem; line-height: 1.6; }
.lead { color: var(--muted); margin: 0 0 1.5rem; }

nav.top { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2rem; }
nav.top a {
  font-size: .85rem; font-weight: 700; text-decoration: none; color: var(--fg);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: .35rem .95rem;
}
nav.top a:hover { border-color: var(--accent); }
nav.top a.here { background: var(--accent); border-color: var(--accent); color: #05222e; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .9rem; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.1rem 1.25rem; text-decoration: none; color: var(--fg); display: block;
}
.stat:hover { border-color: var(--accent); }
.stat .k { font-size: .78rem; font-weight: 900; letter-spacing: .08em; color: var(--muted); }
.stat .v { font-size: 1.9rem; font-weight: 900; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stat .m { font-size: .8rem; color: var(--muted); }
.stat.feat { border-top: .28rem solid var(--feat); }
.stat.page { border-top: .28rem solid var(--accent); }
.stat.url  { border-top: .28rem solid var(--url); }
.stat.cred { border-top: .28rem solid var(--credit); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 1.3rem 1.4rem; margin-bottom: 1rem; }
.card p { margin: 0 0 .8rem; }
.card p:last-child, .card ul:last-child { margin-bottom: 0; }
.summary { white-space: pre-line; }
.reason { color: var(--muted); font-size: .85rem; }
ul { margin: 0; padding-left: 1.3rem; } li { margin-bottom: .5rem; } li:last-child { margin-bottom: 0; }

.day { display: flex; gap: 1.1rem; align-items: flex-start; margin-bottom: .5rem; }
.day .date {
  flex: 0 0 6.5rem; font-weight: 900; font-variant-numeric: tabular-nums;
  padding-top: 1.15rem; color: var(--muted); font-size: .95rem;
}
.day .body { flex: 1 1 auto; min-width: 0; }
.ev {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: .85rem 1.05rem; margin-bottom: .55rem;
}
.ev.page { border-left: .3rem solid var(--accent); }
.ev.feat { border-left: .3rem solid var(--feat); }
.ev.url  { border-left: .3rem solid var(--url); }
.ev.cred { border-left: .3rem solid var(--credit); }
.ev .t { font-weight: 900; font-size: .95rem; }
.ev .d { color: var(--muted); font-size: .85rem; }
.ev .s { font-size: .9rem; margin-top: .35rem; }

.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: .16rem .6rem;
        border-radius: 999px; background: var(--code-bg); border: 1px solid var(--line);
        color: var(--muted); margin-right: .3rem; }
.chip.tier-S { color: var(--s); border-color: var(--s); }
.chip.tier-A { color: var(--a); border-color: var(--a); }
.chip.tier-N { color: var(--n); border-color: var(--n); }
.chip.tier-B { color: var(--b); border-color: var(--b); }
.chip.tier-C { color: var(--c); border-color: var(--c); }

table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 900; color: var(--muted); font-size: .78rem; letter-spacing: .05em; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

code { font-family: "SFMono-Regular", Consolas, monospace; background: var(--code-bg);
       padding: .12em .4em; border-radius: 4px; font-size: .9em; }
a { color: var(--accent-dark); font-weight: 700; }
.empty { color: var(--muted); }
footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
         color: var(--muted); font-size: .82rem; }
</style>
